version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: fitpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitpulse
      POSTGRES_PASSWORD: fitpulse_secure_password_2026
      POSTGRES_DB: fitpulsedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitpulse-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://fitpulse:fitpulse_secure_password_2026@database:5432/fitpulsedb?schema=public"
      JWT_SECRET: "fitpulse_super_secure_jwt_secret_key_2026_xyz!"
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fitpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
